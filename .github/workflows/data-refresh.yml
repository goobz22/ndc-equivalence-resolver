# The weekly data pipeline:
# refresh → export → publish the serving database → redeploy the API.
#
# Publishes data/web.db to the rolling 'data' release tag (the artifact
# anyone can serve from), then redeploys the ndcres-api Vercel project —
# the database ships INSIDE that function bundle, so a redeploy is what
# picks up fresh data. The UI project bundles no data (it proxies /api/*
# to ndcres-api at request time) and does not need rebuilding here; the
# optional VERCEL_DEPLOY_HOOK remains for operators who want one anyway.
#
# workflow_dispatch stays available for manual runs; the schedule is
# Wednesday 14:00 UTC — after CMS posts the weekly NADAC file.

name: data-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 3"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job-level so the redeploy step's `if` can see it: a step's own
    # env: block is applied AFTER its `if` is evaluated, and `secrets`
    # is not an allowed context in step-level `if` expressions.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Refresh all sources (live downloads, ~2GB)
        run: uv run ndcres --db data/ndcres.db refresh --data-dir data/raw
      - name: Download the durable history archive (first run tolerated)
        env:
          GH_TOKEN: ${{ github.token }}
        # A transient failure here must FAIL THE JOB — falling through
        # would let a fresh empty archive clobber-upload over the real
        # one (release assets keep no version history). Only a genuinely
        # missing release/asset may proceed without a download.
        run: |
          if assets=$(gh release view data --json assets --jq '.assets[].name' 2>&1); then
            if echo "$assets" | grep -qx 'ndcres-history.db'; then
              gh release download data --pattern ndcres-history.db --dir data
            else
              echo "release exists but no archive asset yet - will create"
            fi
          elif echo "$assets" | grep -qi 'not found'; then
            echo "no data release yet - archive will be created"
          else
            echo "transient failure checking the release: $assets" >&2
            exit 1
          fi
          if [ -f data/ndcres-history.db ]; then
            sqlite3 data/ndcres-history.db 'SELECT count(*) FROM sweep_run' > data/.archive-baseline
          else
            echo 0 > data/.archive-baseline
          fi
          echo "baseline sweep runs: $(cat data/.archive-baseline)"
      - name: Snapshot the FDA shortage list (FDA keeps no history; we do)
        run: uv run ndcres --db data/ndcres.db fda-snapshot --history data/ndcres-history.db
      - name: Market-wide sweep (appends to the archive)
        run: uv run ndcres --db data/ndcres.db sweep --history data/ndcres-history.db
      - name: Export the serving database (size-gated)
        run: uv run ndcres --db data/ndcres.db export --web --out data/web.db
      - name: Smoke-check the export against the golden anchor
        run: |
          NDCRES_DB=data/web.db uv run python - <<'PY'
          from ndcres.db import connect
          from ndcres.resolve import resolve
          res = resolve(connect("data/web.db"), "0378-4642-26")
          t1 = {a.dims.ndc11 for a in res.tiers["T1"]}
          assert "65162099308" in t1, f"Dotti missing from live T1: {sorted(t1)}"
          t3 = {a.dims.ndc11 for a in res.tiers["T3"]}
          assert "65162014908" in t3, "Lyllana missing from live T3"
          assert res.class_assessment is not None
          print("smoke ok:", res.class_assessment.verdict)
          PY
      - name: Publish to the rolling data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Data artifact (rolling)" \
              --notes "Weekly-refreshed serving database. Fetched at build time; never committed."
          baseline=$(cat data/.archive-baseline)
          runs=$(sqlite3 data/ndcres-history.db 'SELECT count(*) FROM sweep_run')
          echo "archive sweep runs: $baseline -> $runs"
          if [ "$runs" -le "$baseline" ]; then
            echo "archive did not grow past its downloaded baseline - refusing to publish" >&2
            exit 1
          fi
          gh release upload data data/web.db --clobber
          gh release upload data data/ndcres-history.db --clobber
      - name: Quarterly dated archive copy (first run of Jan/Apr/Jul/Oct)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%m); day=$(date -u +%d)
          case "$month" in 01|04|07|10) ;; *) exit 0 ;; esac
          [ "$day" -le 7 ] || exit 0
          quarter=$(( (10#$month - 1) / 3 + 1 ))
          name="ndcres-history-$(date -u +%Y)Q${quarter}.db"
          cp data/ndcres-history.db "data/$name"
          gh release upload data "data/$name" --clobber
      - name: Redeploy the API with the fresh database
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_ORG_ID: team_dCPoXF5E9H4gY3LCVhlXHm4X
          VERCEL_PROJECT_ID: prj_rD2dW3XpbY8KIHxfSygB778Nxc9x
        working-directory: apiserver
        run: |
          node sync-assets.mjs
          npx vercel@58 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Trigger Vercel deploy hook (optional, UI)
        if: ${{ vars.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ vars.VERCEL_DEPLOY_HOOK }}" -o /dev/null
